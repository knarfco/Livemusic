<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CORXIT Stage — Live Music Tonight</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');
:root{
  --obsidian:#0D0E10; --obsidian-raised:#17181B; --obsidian-line:#2A2C30;
  --white:#FFFFFF; --white-soft:rgba(255,255,255,.78); --white-faint:rgba(255,255,255,.5);
  --orange:#FF7A1A; --orange-hot:#FF4D00; --cream:#F7F5F1;
  --font-display:'Inter Tight',system-ui,sans-serif; --font-body:'Inter',system-ui,sans-serif; --font-mono:'IBM Plex Mono','Courier New',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);background:var(--cream);color:var(--obsidian)}
.header{background:var(--obsidian);padding:20px}
.brand{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.brand .mark{font-family:var(--font-mono);font-size:12px;font-weight:600;letter-spacing:.1em;color:var(--orange);text-transform:uppercase}
.brand .product{font-family:var(--font-display);font-size:15px;font-weight:700;color:var(--white)}
.header h1{color:var(--white);font-family:var(--font-display);font-weight:800;font-size:21px}
.header p{color:var(--white-faint);font-size:13px;margin-top:4px}
.day-picker{display:flex;gap:8px;padding:14px 16px;overflow-x:auto;background:var(--white);border-bottom:1px solid #eee}
.day-btn{flex:0 0 auto;padding:8px 14px;border-radius:20px;border:1px solid #ddd;background:var(--white);font-family:var(--font-mono);font-size:12.5px;font-weight:600;color:var(--obsidian);cursor:pointer}
.day-btn.active{background:var(--orange);color:var(--obsidian);border-color:var(--orange)}
.list{padding:16px}
.card{background:var(--white);border-radius:12px;padding:16px 20px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,0.06);border-left:3px solid var(--orange)}
.card .venue{font-family:var(--font-display);font-weight:800;font-size:16px;color:var(--obsidian)}
.card .city{font-size:12px;color:#888;margin-bottom:6px}
.card .band{font-size:15px;color:#333;margin-top:4px}
.card .time{font-family:var(--font-mono);font-size:13px;color:var(--orange-hot);font-weight:600}
.empty{padding:40px 20px;text-align:center;color:#888}
</style>
</head>
<body>
<div class="header">
  <div class="brand"><span class="mark">CORXIT</span><span class="product">STAGE (working title)</span></div>
  <h1>&#127925; Live Music Tonight</h1>
  <p>Updated directly by the venues, as it happens</p>
</div>
<div class="day-picker" id="dayPicker"></div>
<div class="list" id="list"><div class="empty">Loading…</div></div>

<script>
const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function fmtDate(d) {
  return d.toISOString().slice(0, 10);
}
function dayLabel(d, i) {
  if (i === 0) return "Tonight";
  if (i === 1) return "Tomorrow";
  return d.toLocaleDateString(undefined, { weekday: "short" });
}
function fmtTime(t) {
  if (!t) return "";
  const [h, m] = t.split(":");
  const hour = ((+h + 11) % 12) + 1;
  const ampm = +h < 12 ? "AM" : "PM";
  return `${hour}:${m} ${ampm}`;
}

const days = Array.from({ length: 7 }, (_, i) => {
  const d = new Date();
  d.setDate(d.getDate() + i);
  return d;
});

let selected = fmtDate(days[0]);

function renderPicker() {
  const el = document.getElementById("dayPicker");
  el.innerHTML = "";
  days.forEach((d, i) => {
    const btn = document.createElement("button");
    btn.className = "day-btn" + (fmtDate(d) === selected ? " active" : "");
    btn.textContent = dayLabel(d, i);
    btn.onclick = () => { selected = fmtDate(d); renderPicker(); loadShows(); };
    el.appendChild(btn);
  });
}

async function loadShows() {
  const listEl = document.getElementById("list");
  listEl.innerHTML = '<div class="empty">Loading…</div>';

  const { data, error } = await client
    .from("shows")
    .select("band_name, start_time, notes, venues(name, city)")
    .eq("show_date", selected)
    .order("start_time", { ascending: true });

  if (error) {
    listEl.innerHTML = `<div class="empty">Couldn't load the schedule right now.</div>`;
    console.error(error);
    return;
  }
  if (!data || data.length === 0) {
    listEl.innerHTML = '<div class="empty">No live music posted for this day yet.</div>';
    return;
  }

  listEl.innerHTML = "";
  for (const show of data) {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="venue">${show.venues?.name ?? "Venue"}</div>
      <div class="city">${show.venues?.city ?? ""}</div>
      <div class="band">${show.band_name}</div>
      <div class="time">${fmtTime(show.start_time)}</div>
    `;
    listEl.appendChild(card);
  }
}

renderPicker();
loadShows();
</script>
</body>
</html>
