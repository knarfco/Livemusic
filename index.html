<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stage — Live Music Tonight</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Boogaloo&family=Poppins:wght@400;500;600;700&display=swap');
:root{
  --plum:#2B1331; --plum-deep:#1C0C22;
  --orange:#F4622D; --gold:#F4B942; --pink:#E63B7A; --teal:#1B6B6B;
  --cream:#FDF3E7; --ink:#2B1331;
  --font-display:'Boogaloo',cursive; --font-body:'Poppins',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);background:var(--cream);color:var(--ink)}
body{background-image:radial-gradient(rgba(43,19,49,.06) 1.5px, transparent 1.5px);background-size:16px 16px}
.header{background:var(--plum-deep);padding:32px 20px 26px;position:relative;overflow:hidden;text-align:center}
.header::before{
  content:"";position:absolute;top:-150%;left:50%;width:250vmax;height:250vmax;transform:translateX(-50%);
  background-image:repeating-conic-gradient(from 0deg, rgba(244,98,45,.4) 0deg 5deg, transparent 5deg 12deg);
  animation:spin 90s linear infinite;z-index:0
}
.header>*{position:relative;z-index:1}
@keyframes spin{to{transform:translateX(-50%) rotate(360deg)}}
.header h1{
  font-family:var(--font-display);font-weight:400;font-size:38px;letter-spacing:.02em;
  background:linear-gradient(90deg,var(--gold),var(--orange) 50%,var(--pink));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(2px 2px 0 rgba(0,0,0,.35))
}
.header p{color:var(--cream);opacity:.75;font-size:13px;margin-top:6px;font-weight:500}
.wave{display:block;width:100%;height:22px;margin-top:-2px}
.day-picker{display:flex;gap:8px;padding:14px 16px 18px;overflow-x:auto;background:var(--orange);
  background-image:radial-gradient(var(--cream) 3px, transparent 3.5px);background-size:22px 100%;background-position:0 -11px}
.day-btn{flex:0 0 auto;padding:8px 16px;border-radius:20px;border:2px solid var(--plum-deep);background:var(--cream);font-family:var(--font-display);font-size:15px;font-weight:400;color:var(--plum-deep);cursor:pointer}
.day-btn.active{background:var(--pink);color:var(--cream);border-color:var(--cream)}
.list{padding:22px 18px 18px}
.card{
  position:relative;background:var(--cream);border-radius:4px;padding:20px 20px 18px;margin-bottom:22px;
  box-shadow:5px 5px 0 var(--teal);border:2px solid var(--plum-deep);transition:transform .15s ease
}
.card:nth-child(odd){transform:rotate(-1.1deg)}
.card:nth-child(even){transform:rotate(.9deg)}
.card:hover,.card:active{transform:rotate(0deg) scale(1.015)}
.card::before{
  content:"";position:absolute;top:-9px;left:50%;transform:translateX(-50%);
  width:16px;height:16px;border-radius:50%;background:var(--pink);border:2px solid var(--plum-deep)
}
.card .venue{font-family:var(--font-display);font-weight:400;font-size:22px;color:var(--plum-deep)}
.card .city{font-size:12px;color:var(--teal);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.card .band{font-size:16px;color:var(--ink);margin-top:4px;font-weight:600}
.card .time{font-family:var(--font-display);font-size:16px;color:var(--orange);font-weight:400}
.empty{padding:40px 20px;text-align:center;color:var(--plum);font-weight:500}

.badge{display:inline-block;font-family:var(--font-display);font-size:11px;letter-spacing:.08em;padding:3px 10px;border-radius:20px;margin-bottom:10px}
.featured{padding:18px 18px 4px}
.center-card{
  position:relative;background:var(--cream);border-radius:6px;padding:26px 24px;margin-bottom:18px;
  border:3px solid var(--gold);box-shadow:0 0 0 4px var(--plum-deep), 0 0 24px rgba(244,185,66,.5)
}
.center-card .badge{background:var(--gold);color:var(--plum-deep)}
.center-card .venue{font-family:var(--font-display);font-size:30px;color:var(--plum-deep)}
.center-card .city{font-size:12px;color:var(--teal);margin:4px 0 8px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.center-card .band{font-size:19px;font-weight:700;color:var(--ink)}
.center-card .time{font-family:var(--font-display);font-size:18px;color:var(--orange)}
.wings{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:8px}
.wing-card{
  position:relative;background:var(--cream);border-radius:6px;padding:22px 18px;border:2.5px solid var(--orange);box-shadow:4px 4px 0 var(--plum-deep)
}
.wing-card .badge{background:var(--orange);color:var(--cream);font-size:10px;padding:2px 8px}
.wing-card .venue{font-family:var(--font-display);font-size:25px;color:var(--plum-deep)}
.wing-card .city{font-size:11px;color:var(--teal);margin:2px 0 6px;font-weight:600;text-transform:uppercase}
.wing-card .band{font-size:17px;font-weight:600;color:var(--ink)}
.wing-card .time{font-family:var(--font-display);font-size:17px;color:var(--orange)}
@media (max-width:420px){.wings{grid-template-columns:1fr}}

.directory{padding:8px 18px 40px}
.directory h2{font-family:var(--font-display);font-weight:400;font-size:18px;color:var(--plum);margin-bottom:10px}
.directory ul{list-style:none}
.directory li{font-size:13px;color:var(--plum);opacity:.7;padding:4px 0;border-bottom:1px dashed rgba(43,19,49,.15)}
.directory li span{opacity:.6;font-size:11px}
</style>
</head>
<body>
<div class="header">
  <h1>&#9835; STAGE</h1>
  <p>Live music tonight, updated by the venues as it happens</p>
</div>
<svg class="wave" viewBox="0 0 1440 40" preserveAspectRatio="none"><path fill="#F4622D" d="M0,20 C240,40 480,0 720,20 C960,40 1200,0 1440,20 L1440,40 L0,40 Z"/></svg>
<div class="day-picker" id="dayPicker"></div>
<div class="list" id="list"><div class="empty">Loading…</div></div>
<div class="directory" id="directory"></div>

<script>
const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function fmtDate(d) {
  return d.toISOString().slice(0, 10);
}
function dayLabel(d, i) {
  if (i === 0) return "Tonight";
  if (i === 1) return "Tomorrow";
  return d.toLocaleDateString(undefined, { weekday: "short" });
}
function fmtTime(t) {
  if (!t) return "";
  const [h, m] = t.split(":");
  const hour = ((+h + 11) % 12) + 1;
  const ampm = +h < 12 ? "AM" : "PM";
  return `${hour}:${m} ${ampm}`;
}

const days = Array.from({ length: 7 }, (_, i) => {
  const d = new Date();
  d.setDate(d.getDate() + i);
  return d;
});

let selected = fmtDate(days[0]);

function renderPicker() {
  const el = document.getElementById("dayPicker");
  el.innerHTML = "";
  days.forEach((d, i) => {
    const btn = document.createElement("button");
    btn.className = "day-btn" + (fmtDate(d) === selected ? " active" : "");
    btn.textContent = dayLabel(d, i);
    btn.onclick = () => { selected = fmtDate(d); renderPicker(); loadShows(); };
    el.appendChild(btn);
  });
}

function cardHTML(show) {
  return `
    <div class="venue">${show.venues?.name ?? "Venue"}</div>
    <div class="city">${show.venues?.city ?? ""}</div>
    <div class="band">${show.band_name}</div>
    <div class="time">${fmtTime(show.start_time)}</div>
  `;
}

async function loadShows() {
  const listEl = document.getElementById("list");
  listEl.innerHTML = '<div class="empty">Loading…</div>';

  const { data, error } = await client
    .from("shows")
    .select("band_name, start_time, notes, venues(name, city, tier)")
    .eq("show_date", selected)
    .order("start_time", { ascending: true });

  if (error) {
    listEl.innerHTML = `<div class="empty">Couldn't load the schedule right now.</div>`;
    console.error(error);
    return;
  }
  if (!data || data.length === 0) {
    listEl.innerHTML = '<div class="empty">No live music posted for this day yet.</div>';
    return;
  }

  const center = data.filter((s) => s.venues?.tier === "center_stage");
  const left = data.filter((s) => s.venues?.tier === "stage_left");
  const right = data.filter((s) => s.venues?.tier === "stage_right");
  const wings = [...left, ...right];
  const usedTiers = new Set(["center_stage", "stage_left", "stage_right"]);
  const regular = data.filter((s) => !usedTiers.has(s.venues?.tier));

  let html = "";
  if (center.length) {
    html += `<div class="featured">${center
      .map((s) => `<div class="center-card"><span class="badge">&#9733; CENTER STAGE</span>${cardHTML(s)}</div>`)
      .join("")}</div>`;
  }
  if (wings.length) {
    html += `<div class="featured wings">${wings
      .map((s) => {
        const isLeft = s.venues?.tier === "stage_left";
        return `<div class="wing-card ${isLeft ? "left" : "right"}"><span class="badge">${isLeft ? "STAGE LEFT" : "STAGE RIGHT"}</span>${cardHTML(s)}</div>`;
      })
      .join("")}</div>`;
  }
  html += regular.map((s) => `<div class="card">${cardHTML(s)}</div>`).join("");

  listEl.innerHTML = html || '<div class="empty">No live music posted for this day yet.</div>';
}

async function loadDirectory() {
  const dirEl = document.getElementById("directory");
  const { data, error } = await client
    .from("venues")
    .select("name, city, is_active")
    .eq("is_active", false)
    .order("name", { ascending: true });

  if (error || !data || data.length === 0) return;

  dirEl.innerHTML = `
    <h2>More Venues on the Space Coast</h2>
    <ul>${data.map((v) => `<li>${v.name} <span>— ${v.city}</span></li>`).join("")}</ul>
  `;
}

renderPicker();
loadShows();
loadDirectory();
</script>
</body>
</html>
