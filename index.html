<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AreaBands — Live Music Tonight</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Boogaloo&family=Poppins:wght@400;500;600;700&display=swap');
:root{
  --plum:#2B1331; --plum-deep:#1C0C22;
  --orange:#F4622D; --gold:#F4B942; --pink:#E63B7A; --teal:#1B6B6B;
  --cream:#FDF3E7; --ink:#2B1331;
  --font-display:'Boogaloo',cursive; --font-body:'Poppins',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);background:var(--cream);color:var(--ink)}
body{background-image:radial-gradient(rgba(43,19,49,.06) 1.5px, transparent 1.5px);background-size:16px 16px}
.header{background:var(--plum-deep);padding:32px 20px 26px;position:relative;overflow:hidden;text-align:center}
.header::before{
  content:"";position:absolute;top:-150%;left:50%;width:250vmax;height:250vmax;transform:translateX(-50%);
  background-image:repeating-conic-gradient(from 0deg, rgba(244,98,45,.4) 0deg 5deg, transparent 5deg 12deg);
  animation:spin 90s linear infinite;z-index:0
}
.header>*{position:relative;z-index:1}
@keyframes spin{to{transform:translateX(-50%) rotate(360deg)}}
.header .brand-logo{height:74px;max-width:80%;margin:0 auto;display:block}
.header p{color:var(--cream);opacity:.75;font-size:13px;margin-top:6px;font-weight:500}
.wave{display:block;width:100%;height:22px;margin-top:-2px}
.day-picker{display:flex;gap:8px;padding:14px 16px 18px;overflow-x:auto;background:var(--orange);
  background-image:radial-gradient(var(--cream) 3px, transparent 3.5px);background-size:22px 100%;background-position:0 -11px}
.day-btn{flex:0 0 auto;padding:8px 16px;border-radius:20px;border:2px solid var(--plum-deep);background:var(--cream);font-family:var(--font-display);font-size:15px;font-weight:400;color:var(--plum-deep);cursor:pointer}
.day-btn.active{background:var(--pink);color:var(--cream);border-color:var(--cream)}
.list{padding:22px 18px 18px}
.card{
  position:relative;padding:12px 2px;margin-bottom:0;border-bottom:1px solid rgba(43,19,49,.15)
}
.card .venue{font-family:var(--font-display);font-weight:400;font-size:17px;color:var(--plum-deep)}
.card .city{font-size:10.5px;color:var(--teal);margin-bottom:3px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.card .band{font-size:14px;color:var(--ink);margin-top:2px;font-weight:600}
.card .time{font-family:var(--font-display);font-size:14px;color:var(--orange);font-weight:400}
.empty{padding:40px 20px;text-align:center;color:var(--plum);font-weight:500}
.gate{padding:36px 22px;text-align:center;color:var(--plum);font-weight:500}
.gate .gate-title{font-family:var(--font-display);font-size:22px;color:var(--plum-deep);margin-bottom:8px}
.gate p{font-size:14px;max-width:320px;margin:0 auto}

.badge{display:inline-block;font-family:var(--font-display);font-size:11px;letter-spacing:.08em;padding:3px 10px;border-radius:20px;margin-bottom:10px}
.featured{padding:18px 18px 4px}
.center-card{
  position:relative;background:var(--cream);border-radius:8px;padding:32px 26px;margin-bottom:20px;
  border:4px solid var(--gold);
  box-shadow:0 0 0 3px var(--gold), 0 0 0 6px var(--orange), 0 0 0 9px var(--pink), 0 0 34px rgba(230,59,122,.65)
}
.center-card .badge{
  background:linear-gradient(90deg,var(--gold),var(--orange),var(--pink));color:var(--plum-deep);font-size:12px;padding:4px 12px
}
.center-card .venue{
  font-family:var(--font-display);font-size:38px;
  background:linear-gradient(90deg,var(--pink),var(--orange),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent
}
.center-card .city{font-size:13px;color:var(--teal);margin:5px 0 10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.center-card .band{font-size:22px;font-weight:700;color:var(--ink)}
.center-card .time{font-family:var(--font-display);font-size:20px;color:var(--orange)}
.wings{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.wing-card{
  position:relative;background:var(--cream);border-radius:5px;padding:12px 10px;border:2px solid var(--orange);box-shadow:2px 2px 0 var(--plum-deep)
}
.wing-card .badge{background:var(--orange);color:var(--cream);font-size:8.5px;padding:2px 6px}
.wing-card .venue{font-family:var(--font-display);font-size:16px;color:var(--plum-deep)}
.wing-card .city{font-size:9px;color:var(--teal);margin:1px 0 4px;font-weight:600;text-transform:uppercase}
.wing-card .band{font-size:12px;font-weight:600;color:var(--ink)}
.wing-card .time{font-family:var(--font-display);font-size:12px;color:var(--orange)}
.tonight-flag{display:inline-block;font-size:11px;font-weight:700;color:var(--pink);margin-left:6px}
@media (max-width:420px){.wings{grid-template-columns:1fr}}
.offer-badge{display:block;margin-top:6px;font-family:var(--font-display);font-size:12px;background:var(--pink);color:var(--cream);border:none;padding:5px 12px;border-radius:20px;cursor:pointer}
.offer-reveal{display:none;margin-top:6px;font-size:12.5px;font-weight:600;color:var(--plum-deep);background:var(--cream);border:2px dashed var(--pink);border-radius:6px;padding:8px 10px}
.offer-reveal.shown{display:block}

.directory{padding:8px 18px 40px}
.directory h2{font-family:var(--font-display);font-weight:400;font-size:18px;color:var(--plum);margin-bottom:10px}
.directory ul{list-style:none}
.directory li{font-size:13px;color:var(--plum);opacity:.7;padding:4px 0;border-bottom:1px dashed rgba(43,19,49,.15)}
.directory li span{opacity:.6;font-size:11px}

.near-me{background:var(--plum);padding:14px 18px;text-align:center}
.near-me-btn{font-family:var(--font-display);font-size:15px;background:var(--gold);color:var(--plum-deep);border:2px solid var(--plum-deep);padding:8px 18px;border-radius:20px;cursor:pointer}
.near-me-toggle{display:block;color:var(--cream);opacity:.7;font-size:12px;margin-top:8px;text-decoration:underline;background:none;border:none;cursor:pointer;width:100%}
.near-me-address{display:none;gap:8px;margin-top:10px}
.near-me-address input{flex:1;padding:8px 10px;border-radius:20px;border:2px solid var(--plum-deep);font-family:var(--font-body);font-size:14px}
.near-me-address button{font-family:var(--font-display);font-size:14px;background:var(--orange);color:var(--cream);border:2px solid var(--plum-deep);padding:0 16px;border-radius:20px;cursor:pointer}
.near-me-status{color:var(--cream);opacity:.8;font-size:12px;margin-top:8px}
.distance{font-family:var(--font-body);font-size:11px;font-weight:700;color:var(--teal);text-transform:uppercase;letter-spacing:.03em}
.claim-footer{background:var(--plum-deep);padding:22px 20px 28px;text-align:center}
.claim-footer p{color:var(--cream);opacity:.75;font-size:12.5px;margin-bottom:8px}
.claim-footer a{font-family:var(--font-display);font-size:16px;color:var(--gold);text-decoration:underline}
</style>
</head>
<body>
<div class="header">
  <img class="brand-logo" src="assets/areabands-header.svg" alt="AreaBands">
  <div style="font-family:var(--font-display);font-size:17px;color:var(--gold);letter-spacing:.03em;margin-top:6px">Bars. Bands. Nearby.</div>
  <p style="margin-top:4px">Live music tonight, updated by the venues as it happens</p>
  <p style="margin-top:8px"><a href="about.html" style="color:var(--gold);text-decoration:underline;font-size:12px">Own a bar or venue? Learn more &rarr;</a></p>
</div>
<svg class="wave" viewBox="0 0 1440 40" preserveAspectRatio="none"><path fill="#F4622D" d="M0,20 C240,40 480,0 720,20 C960,40 1200,0 1440,20 L1440,40 L0,40 Z"/></svg>
<div class="near-me">
  <button class="near-me-btn" id="useLocationBtn">&#128205; Use My Location</button>
  <button class="near-me-toggle" id="toggleAddress">or type an address / hotel instead</button>
  <div class="near-me-address" id="addressBox">
    <input type="text" id="addressInput" placeholder="e.g. 1300 N Atlantic Ave, Cocoa Beach">
    <button id="addressGoBtn">Go</button>
  </div>
  <div class="near-me-status" id="nearMeStatus"></div>
</div>
<div class="day-picker" id="dayPicker"></div>
<div class="list" id="list"><div class="empty">Loading…</div></div>
<div class="directory" id="directory"></div>
<div class="claim-footer">
  <p>See your bar or venue in the list above, unclaimed?</p>
  <a href="signup.html">Is this your business? Claim your free listing &rarr;</a>
</div>

<script>
const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function fmtDate(d) {
  return d.toISOString().slice(0, 10);
}
function dayLabel(d, i) {
  if (i === 0) return "Tonight";
  if (i === 1) return "Tomorrow";
  return d.toLocaleDateString(undefined, { weekday: "short" });
}
function fmtTime(t) {
  if (!t) return "";
  const [h, m] = t.split(":");
  const hour = ((+h + 11) % 12) + 1;
  const ampm = +h < 12 ? "AM" : "PM";
  return `${hour}:${m} ${ampm}`;
}

let userLoc = null; // {lat, lng}

function haversineMiles(lat1, lng1, lat2, lng2) {
  const R = 3958.8;
  const toRad = (d) => (d * Math.PI) / 180;
  const dLat = toRad(lat2 - lat1);
  const dLng = toRad(lng2 - lng1);
  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}
function distanceLabel(venue) {
  if (!userLoc || venue?.lat == null || venue?.lng == null) return "";
  const mi = haversineMiles(userLoc.lat, userLoc.lng, venue.lat, venue.lng);
  return `<div class="distance">${mi < 0.1 ? "right here" : mi.toFixed(1) + " mi away"}</div>`;
}
async function geocode(query) {
  try {
    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(query)}`);
    const results = await res.json();
    if (!results || !results[0]) return null;
    return { lat: parseFloat(results[0].lat), lng: parseFloat(results[0].lon) };
  } catch (e) {
    console.error("geocode failed", e);
    return null;
  }
}
function setUserLoc(loc, statusText) {
  userLoc = loc;
  document.getElementById("nearMeStatus").textContent = statusText;
  loadShows();
  loadDirectory();
}

document.getElementById("useLocationBtn").addEventListener("click", () => {
  const statusEl = document.getElementById("nearMeStatus");
  if (!navigator.geolocation) {
    statusEl.textContent = "Location isn't available on this device — try typing an address instead.";
    return;
  }
  statusEl.textContent = "Finding you…";
  navigator.geolocation.getCurrentPosition(
    (pos) => setUserLoc({ lat: pos.coords.latitude, lng: pos.coords.longitude }, "Showing what's closest to you."),
    () => { statusEl.textContent = "Couldn't get your location — try typing an address instead."; }
  );
});

document.getElementById("toggleAddress").addEventListener("click", () => {
  const box = document.getElementById("addressBox");
  box.style.display = box.style.display === "flex" ? "none" : "flex";
});

document.getElementById("addressGoBtn").addEventListener("click", async () => {
  const q = document.getElementById("addressInput").value.trim();
  const statusEl = document.getElementById("nearMeStatus");
  if (!q) return;
  statusEl.textContent = "Looking that up…";
  const loc = await geocode(q);
  if (!loc) { statusEl.textContent = "Couldn't find that address — try adding the city."; return; }
  setUserLoc(loc, `Showing what's closest to "${q}".`);
});

const days = Array.from({ length: 7 }, (_, i) => {
  const d = new Date();
  d.setDate(d.getDate() + i);
  return d;
});

let selected = fmtDate(days[0]);

function renderPicker() {
  const el = document.getElementById("dayPicker");
  el.innerHTML = "";
  days.forEach((d, i) => {
    const btn = document.createElement("button");
    btn.className = "day-btn" + (fmtDate(d) === selected ? " active" : "");
    btn.textContent = dayLabel(d, i);
    btn.onclick = () => { selected = fmtDate(d); renderPicker(); loadShows(); };
    el.appendChild(btn);
  });
}

let offersByVenue = {};

function cardHTML(show) {
  const offer = offersByVenue[show.venue_id];
  return `
    <div class="venue">${show.venues?.name ?? "Venue"}</div>
    <div class="city">${show.venues?.city ?? ""}</div>
    ${distanceLabel(show.venues)}
    <div class="band">${show.band_name}</div>
    <div class="time">${fmtTime(show.start_time)}</div>
    ${offer ? `
      <button class="offer-badge" data-venue-id="${show.venue_id}">&#127903; Special Offer</button>
      <div class="offer-reveal" data-venue-id="${show.venue_id}">${offer}</div>
    ` : ""}
  `;
}

// Best-effort visit tracking + offer claim logging -- these never block the
// page and a failure here should never be visible to the person browsing.
function logVenueViews(venueIds) {
  const unique = [...new Set(venueIds)].filter(Boolean);
  unique.forEach((venue_id) => {
    client.from("venue_views").insert({ venue_id }).then(() => {}, () => {});
  });
}

async function loadOffers(venueIds) {
  const unique = [...new Set(venueIds)].filter(Boolean);
  offersByVenue = {};
  if (!unique.length) return;
  const { data } = await client.from("venue_offers").select("venue_id, offer_text").in("venue_id", unique);
  (data || []).forEach((o) => { offersByVenue[o.venue_id] = o.offer_text; });
}

document.getElementById("list").addEventListener("click", (e) => {
  const btn = e.target.closest(".offer-badge");
  if (!btn) return;
  const venueId = btn.dataset.venueId;
  const reveal = document.querySelector(`.offer-reveal[data-venue-id="${venueId}"]`);
  if (reveal && !reveal.classList.contains("shown")) {
    reveal.classList.add("shown");
    client.from("offer_claims").insert({ venue_id: venueId }).then(() => {}, () => {});
  }
});

async function loadShows() {
  const listEl = document.getElementById("list");
  listEl.innerHTML = '<div class="empty">Loading…</div>';

  const { data, error } = await client
    .from("shows")
    .select("venue_id, band_name, start_time, notes, venues(name, city, tier, lat, lng)")
    .eq("show_date", selected)
    .order("start_time", { ascending: true });

  if (error) {
    listEl.innerHTML = `<div class="empty">Couldn't load the schedule right now.</div>`;
    console.error(error);
    return;
  }
  if (!data || data.length === 0) {
    listEl.innerHTML = '<div class="empty">No live music posted for this day yet.</div>';
    return;
  }

  await loadOffers(data.map((s) => s.venue_id));

  if (userLoc) {
    data.sort((a, b) => {
      const da = a.venues?.lat != null ? haversineMiles(userLoc.lat, userLoc.lng, a.venues.lat, a.venues.lng) : Infinity;
      const db = b.venues?.lat != null ? haversineMiles(userLoc.lat, userLoc.lng, b.venues.lat, b.venues.lng) : Infinity;
      return da - db;
    });
  }

  const center = data.filter((s) => s.venues?.tier === "center_stage");
  const left = data.filter((s) => s.venues?.tier === "stage_left");
  const right = data.filter((s) => s.venues?.tier === "stage_right");
  const wings = [...left, ...right];
  const usedTiers = new Set(["center_stage", "stage_left", "stage_right"]);
  const regular = data.filter((s) => !usedTiers.has(s.venues?.tier));

  let html = "";
  if (center.length) {
    html += `<div class="featured">${center
      .map((s) => `<div class="center-card"><span class="badge">&#9733; CENTER STAGE</span>${cardHTML(s)}</div>`)
      .join("")}</div>`;
  }
  if (wings.length) {
    html += `<div class="featured wings">${wings
      .map((s) => {
        const isLeft = s.venues?.tier === "stage_left";
        return `<div class="wing-card ${isLeft ? "left" : "right"}"><span class="badge">${isLeft ? "STAGE LEFT" : "STAGE RIGHT"}</span>${cardHTML(s)}</div>`;
      })
      .join("")}</div>`;
  }
  html += regular.map((s) => `<div class="card">${cardHTML(s)}</div>`).join("");

  listEl.innerHTML = html || '<div class="empty">No live music posted for this day yet.</div>';
  logVenueViews(data.map((s) => s.venue_id));
}

async function loadDirectory() {
  const dirEl = document.getElementById("directory");
  const { data, error } = await client
    .from("venues")
    .select("id, name, city, is_active, lat, lng")
    .eq("is_active", false)
    .order("name", { ascending: true });

  if (error || !data || data.length === 0) return;

  if (userLoc) {
    data.sort((a, b) => {
      const da = a.lat != null ? haversineMiles(userLoc.lat, userLoc.lng, a.lat, a.lng) : Infinity;
      const db = b.lat != null ? haversineMiles(userLoc.lat, userLoc.lng, b.lat, b.lng) : Infinity;
      return da - db;
    });
  }

  const { data: flags } = await client
    .from("public_show_flags")
    .select("venue_id")
    .eq("show_date", selected);
  const hasShowTonight = new Set((flags || []).map((f) => f.venue_id));

  dirEl.innerHTML = `
    <h2>More Venues on the Space Coast</h2>
    <ul>${data
      .map(
        (v) =>
          `<li>${v.name} <span>— ${v.city}</span> ${distanceLabel(v)}${
            hasShowTonight.has(v.id) ? '<span class="tonight-flag">&#9835; something\'s happening — upgrade to see who</span>' : ""
          }</li>`
      )
      .join("")}</ul>
  `;
}

renderPicker();
loadShows();
loadDirectory();
</script>
</body>
</html>
