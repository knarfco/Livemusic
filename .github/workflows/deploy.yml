name: Deploy site to Hostinger

# Uploads the public web files straight to Hostinger over FTP.
# Push-trigger deliberately removed: this account's default landing
# directory is now MediaIn360's deploy target too (see
# deploy-mediain360.yml), so an automatic deploy on every push here
# would overwrite MediaIn360's live files with this repo's own.
# Trigger manually (Actions tab -> this workflow -> Run workflow) if
# this site itself needs a fresh deploy.
on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          protocol: ftp
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          # Deliberately not using the HOSTINGER_FTP_DIR secret: the FTP
          # account already lands directly in public_html on login, and
          # that secret also says "public_html" -- combined, that's what
          # was creating a public_html/public_html nested on the server on
          # every deploy. "./" means "wherever the connection lands," no
          # extra folder appended.
          server-dir: ./
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/*.sql
            **/*.sh
            **/README.md
