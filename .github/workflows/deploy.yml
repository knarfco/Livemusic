name: Deploy site to Hostinger

# Uploads the public web files straight to Hostinger over FTP any time they
# change on main — replaces zipping the files and uploading them by hand.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          protocol: ftp
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          # Deliberately not using the HOSTINGER_FTP_DIR secret: the FTP
          # account already lands directly in public_html on login, and
          # that secret also says "public_html" -- combined, that's what
          # was creating a public_html/public_html nested on the server on
          # every deploy. "./" means "wherever the connection lands," no
          # extra folder appended.
          server-dir: ./
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/*.sql
            **/*.sh
            **/README.md
