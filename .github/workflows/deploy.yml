name: Deploy site to Hostinger

# Uploads the public web files straight to Hostinger over FTP any time they
# change on main — replaces zipping the files and uploading them by hand.
on:
  # Manual-only for now -- was auto-firing on every push to main, which kept
  # re-creating a nested public_html/public_html on the server because the
  # FTP account's home directory and HOSTINGER_FTP_DIR both point at
  # public_html. Re-enable the push trigger once that's confirmed fixed.
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          protocol: ftp
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          server-dir: ${{ secrets.HOSTINGER_FTP_DIR }}
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/*.sql
            **/*.sh
            **/README.md
