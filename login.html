<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CORXIT Stage — Venue Login</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#0D0E10;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center}
.box{background:#17181B;border-radius:12px;padding:32px;width:100%;max-width:360px}
.brand{display:flex;align-items:baseline;gap:8px;margin-bottom:18px}
.brand .mark{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;letter-spacing:.1em;color:#FF7A1A;text-transform:uppercase}
.brand .product{font-family:'Inter Tight',system-ui,sans-serif;font-size:14px;font-weight:700;color:#fff}
h1{font-family:'Inter Tight',system-ui,sans-serif;font-size:20px;margin-bottom:6px}
p{color:rgba(255,255,255,.5);font-size:13px;margin-bottom:24px}
label{display:block;font-size:13px;margin-bottom:6px;color:#ccc}
input{width:100%;padding:10px 12px;border-radius:6px;border:1px solid #2A2C30;background:#0D0E10;color:#fff;margin-bottom:16px;font-size:15px}
button{width:100%;padding:12px;border:none;border-radius:8px;background:#FF7A1A;color:#0D0E10;font-weight:800;font-size:15px;cursor:pointer}
.error{color:#ff5252;font-size:13px;margin-top:12px;min-height:16px}
</style>
</head>
<body>
<div class="box">
  <div class="brand"><span class="mark">CORXIT</span><span class="product">STAGE (working title)</span></div>
  <h1>Venue Login</h1>
  <p>Update your live music schedule — changes go live immediately.</p>
  <form id="loginForm">
    <label for="email">Email</label>
    <input type="email" id="email" required>
    <label for="password">Password</label>
    <input type="password" id="password" required>
    <button type="submit">Log In</button>
    <div class="error" id="err"></div>
  </form>
</div>
<script>
const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const errEl = document.getElementById("err");
  errEl.textContent = "";

  const { error } = await client.auth.signInWithPassword({ email, password });
  if (error) {
    errEl.textContent = "Couldn't log in — check your email and password.";
    return;
  }
  window.location.href = "dashboard.html";
});
</script>
</body>
</html>
