<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Venue Login — Live Music Space Coast</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0d2137;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center}
.box{background:#17181b;border-radius:12px;padding:32px;width:100%;max-width:360px}
h1{font-size:20px;margin-bottom:6px}
p{color:#8899aa;font-size:13px;margin-bottom:24px}
label{display:block;font-size:13px;margin-bottom:6px;color:#ccc}
input{width:100%;padding:10px 12px;border-radius:6px;border:1px solid #2a2c30;background:#0d0e10;color:#fff;margin-bottom:16px;font-size:15px}
button{width:100%;padding:12px;border:none;border-radius:8px;background:#4fc3f7;color:#0d2137;font-weight:800;font-size:15px;cursor:pointer}
.error{color:#ff5252;font-size:13px;margin-top:12px;min-height:16px}
</style>
</head>
<body>
<div class="box">
  <h1>Venue Login</h1>
  <p>Update your live music schedule — changes go live immediately.</p>
  <form id="loginForm">
    <label for="email">Email</label>
    <input type="email" id="email" required>
    <label for="password">Password</label>
    <input type="password" id="password" required>
    <button type="submit">Log In</button>
    <div class="error" id="err"></div>
  </form>
</div>
<script>
const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const errEl = document.getElementById("err");
  errEl.textContent = "";

  const { error } = await client.auth.signInWithPassword({ email, password });
  if (error) {
    errEl.textContent = "Couldn't log in — check your email and password.";
    return;
  }
  window.location.href = "dashboard.html";
});
</script>
</body>
</html>
