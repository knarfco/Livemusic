<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AreaBands — Venue Login</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Boogaloo&family=Poppins:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Poppins',system-ui,sans-serif;color:#FDF3E7;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:#1C0C22;position:relative;overflow:hidden;
}
body::before{
  content:"";position:absolute;bottom:-150%;left:50%;width:250vmax;height:250vmax;transform:translateX(-50%);
  background-image:repeating-conic-gradient(from 0deg, rgba(244,98,45,.35) 0deg 5deg, transparent 5deg 12deg);
  animation:spin 90s linear infinite;z-index:0
}
@keyframes spin{to{transform:translateX(-50%) rotate(360deg)}}
.box{position:relative;z-index:1;background:#FDF3E7;color:#2B1331;border-radius:6px;padding:32px;width:100%;max-width:360px;border:2px solid #1C0C22;box-shadow:6px 6px 0 #F4B942}
.brand-wordmark{
  font-family:'Boogaloo',cursive;font-weight:400;font-size:30px;letter-spacing:.02em;margin-bottom:10px;
  background:linear-gradient(90deg,#E63B7A,#F4622D,#F4B942);-webkit-background-clip:text;background-clip:text;color:transparent
}
h1{font-family:'Boogaloo',cursive;font-weight:400;font-size:24px;margin-bottom:6px;color:#2B1331}
p{color:#1B6B6B;font-size:13px;margin-bottom:24px;font-weight:500}
label{display:block;font-size:13px;margin-bottom:6px;color:#2B1331;font-weight:600}
input{width:100%;padding:10px 12px;border-radius:4px;border:2px solid #2B1331;background:#fff;color:#2B1331;margin-bottom:16px;font-size:15px;font-family:'Poppins',sans-serif}
button{width:100%;padding:12px;border:2px solid #2B1331;border-radius:4px;background:#F4622D;color:#FDF3E7;font-family:'Boogaloo',cursive;font-size:18px;letter-spacing:.02em;cursor:pointer}
.error{color:#E63B7A;font-size:13px;margin-top:12px;min-height:16px;font-weight:600}
</style>
</head>
<body>
<div class="box">
  <div class="brand-wordmark">AreaBands</div>
  <h1>Venue Login</h1>
  <p>Update your live music schedule — changes go live immediately.</p>
  <form id="loginForm">
    <label for="email">Email</label>
    <input type="email" id="email" required>
    <label for="password">Password</label>
    <input type="password" id="password" required>
    <button type="submit">Log In</button>
    <div class="error" id="err"></div>
  </form>
  <p style="margin-top:18px;margin-bottom:0;text-align:center">New venue? <a href="signup.html" style="color:#F4622D;font-weight:700">List your venue &rarr;</a></p>
</div>
<script>
const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const errEl = document.getElementById("err");
  errEl.textContent = "";

  const { error } = await client.auth.signInWithPassword({ email, password });
  if (error) {
    errEl.textContent = "Couldn't log in — check your email and password.";
    return;
  }
  window.location.href = "dashboard.html";
});
</script>
</body>
</html>
