<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stage — Your Schedule</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Boogaloo&family=Poppins:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',system-ui,sans-serif;background:#FDF3E7;color:#2B1331}
.header{background:#1C0C22;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;position:relative;overflow:hidden}
.header::before{
  content:"";position:absolute;top:-200%;left:50%;width:250vmax;height:250vmax;transform:translateX(-50%);
  background-image:repeating-conic-gradient(from 0deg, rgba(244,98,45,.4) 0deg 5deg, transparent 5deg 12deg);
  animation:spin 90s linear infinite;z-index:0
}
@keyframes spin{to{transform:translateX(-50%) rotate(360deg)}}
.header>*{position:relative;z-index:1}
.header h1{
  font-family:'Boogaloo',cursive;font-weight:400;font-size:22px;
  background:linear-gradient(90deg,#F4B942,#F4622D 60%,#E63B7A);-webkit-background-clip:text;background-clip:text;color:transparent
}
.header button{background:#F4622D;border:2px solid #FDF3E7;color:#FDF3E7;padding:6px 14px;border-radius:4px;font-size:13px;font-weight:700;cursor:pointer}
.wrap{padding:16px;max-width:520px;margin:0 auto}
.card{background:#fff;border-radius:4px;padding:16px 20px;margin-bottom:14px;border:2px solid #2B1331;box-shadow:4px 4px 0 #1B6B6B}
.card .date{font-family:'Boogaloo',cursive;font-weight:400;font-size:19px;color:#2B1331;margin-bottom:10px}
input,button.save,button.del{font-size:14px}
input{width:100%;padding:8px 10px;border-radius:4px;border:2px solid #2B1331;margin-bottom:8px;font-family:'Poppins',sans-serif}
.row{display:flex;gap:8px}
.row input:first-child{flex:2}
.row input:last-child{flex:1}
.actions{display:flex;gap:8px;margin-top:8px;align-items:center}
button.save{background:#1B6B6B;color:#fff;border:2px solid #2B1331;padding:8px 14px;border-radius:4px;cursor:pointer;font-weight:700}
button.del{background:#fff;color:#E63B7A;border:2px solid #E63B7A;padding:8px 14px;border-radius:4px;cursor:pointer;font-weight:700}
.status{font-size:12px;color:#888;margin-left:4px;font-weight:600}
.banner{background:#F4B942;color:#2B1331;font-weight:700;font-size:13.5px;padding:12px 20px;text-align:center;display:none}
</style>
</head>
<body>
<div class="header">
  <h1 id="venueName">Loading…</h1>
  <button id="logout">Log out</button>
</div>
<div class="banner" id="pendingBanner">You're listed for free (name + address). Add $11.97/mo to publish this schedule live — reach out and we'll turn it on.</div>
<div class="wrap" id="wrap">
  <p style="color:#888;font-size:13px;margin-bottom:12px">Add or edit this week's lineup. Saves are live on the site right away — leave the band field blank and save to remove a night.</p>
  <div id="week"></div>
</div>

<script>
const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let venue = null;

function fmtDate(d) { return d.toISOString().slice(0, 10); }
function labelFor(d) {
  return d.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });
}

async function geocode(query) {
  try {
    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(query)}`);
    const results = await res.json();
    if (!results || !results[0]) return null;
    return { lat: parseFloat(results[0].lat), lng: parseFloat(results[0].lon) };
  } catch (e) {
    console.error("geocode failed", e);
    return null;
  }
}

function slugify(name, suffix) {
  const base = name.toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
  return `${base}-${suffix}`;
}

async function init() {
  const { data: { session } } = await client.auth.getSession();
  if (!session) { window.location.href = "login.html"; return; }

  let { data: venueRow } = await client
    .from("venues")
    .select("*")
    .eq("owner_user_id", session.user.id)
    .maybeSingle();

  // First login after signing up (if email confirmation delayed venue creation) —
  // finish creating the venue now from the info saved at signup.
  const pendingName = session.user.user_metadata?.pending_venue_name;
  if (!venueRow && pendingName) {
    const slug = slugify(pendingName, session.user.id.slice(0, 6));
    const pendingAddress = session.user.user_metadata?.pending_venue_address || "";
    const pendingCity = session.user.user_metadata?.pending_venue_city || "Cocoa Beach";
    const coords = await geocode(`${pendingAddress}, ${pendingCity}, FL`);
    const { data: created } = await client
      .from("venues")
      .insert({
        name: pendingName, address: pendingAddress, city: pendingCity,
        slug, owner_user_id: session.user.id, is_active: false,
        lat: coords?.lat ?? null, lng: coords?.lng ?? null,
      })
      .select()
      .single();
    venueRow = created;
  }

  if (!venueRow) {
    document.getElementById("venueName").textContent = "No venue linked to this login yet";
    return;
  }
  venue = venueRow;
  document.getElementById("venueName").textContent = venue.name;
  if (!venue.is_active) {
    document.getElementById("pendingBanner").style.display = "block";
  }
  await renderWeek();
}

async function renderWeek() {
  const weekEl = document.getElementById("week");
  weekEl.innerHTML = "";

  const days = Array.from({ length: 7 }, (_, i) => {
    const d = new Date();
    d.setDate(d.getDate() + i);
    return d;
  });

  const { data: shows } = await client
    .from("shows")
    .select("*")
    .eq("venue_id", venue.id)
    .gte("show_date", fmtDate(days[0]))
    .lte("show_date", fmtDate(days[6]));

  for (const d of days) {
    const dateStr = fmtDate(d);
    const existing = (shows || []).find((s) => s.show_date === dateStr);

    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="date">${labelFor(d)}</div>
      <input type="text" class="band" placeholder="Band / act name" value="${existing?.band_name ?? ""}">
      <div class="row">
        <input type="time" class="start_time" value="${existing?.start_time?.slice(0,5) ?? ""}">
        <input type="text" class="notes" placeholder="Notes (optional)" value="${existing?.notes ?? ""}">
      </div>
      <div class="actions">
        <button class="save">Save</button>
        ${existing ? '<button class="del">Remove</button>' : ""}
        <span class="status"></span>
      </div>
    `;

    card.querySelector(".save").addEventListener("click", async () => {
      const band = card.querySelector(".band").value.trim();
      const startTime = card.querySelector(".start_time").value || null;
      const notes = card.querySelector(".notes").value.trim();
      const statusEl = card.querySelector(".status");

      if (!band) {
        if (existing) await client.from("shows").delete().eq("id", existing.id);
        statusEl.textContent = "Cleared";
      } else if (existing) {
        await client.from("shows").update({ band_name: band, start_time: startTime, notes }).eq("id", existing.id);
        statusEl.textContent = "Saved";
      } else {
        await client.from("shows").insert({ venue_id: venue.id, show_date: dateStr, band_name: band, start_time: startTime, notes });
        statusEl.textContent = "Saved";
      }
      setTimeout(() => renderWeek(), 400);
    });

    if (existing) {
      card.querySelector(".del").addEventListener("click", async () => {
        await client.from("shows").delete().eq("id", existing.id);
        renderWeek();
      });
    }

    weekEl.appendChild(card);
  }
}

document.getElementById("logout").addEventListener("click", async () => {
  await client.auth.signOut();
  window.location.href = "login.html";
});

init();
</script>
</body>
</html>
